{{- if .Values.cluster.singleUserConfiguration.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.singleUserConfiguration.secretRef.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  {{ .Values.cluster.singleUserConfiguration.secretKeys.username }}: {{ .Values.singleUserCredentials.username | b64enc | quote }}
  {{ .Values.cluster.singleUserConfiguration.secretKeys.password }}: {{ .Values.singleUserCredentials.password | b64enc | quote }}
{{- end }}
