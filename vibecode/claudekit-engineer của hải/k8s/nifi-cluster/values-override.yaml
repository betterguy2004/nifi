
# NiFi Cluster Helm values override for POC
# Overrides upstream nifi-cluster chart defaults for NiFi 2.6.0 on Kubernetes manager
# Usage: helm install nifi-cluster ./k8s/nifi-cluster -f ./k8s/values-nifi-cluster.yaml -n nifi

cluster:
  manager: kubernetes
  pod: {}
  service:
    headlessEnabled: true
    annotations:
      service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
  image:
    tag: "2.6.0"
  # Single-user authentication: login with username/password
  singleUserConfiguration:
    enabled: true
    authorizerEnabled: true
    secretRef:
      name: "single-user-credentials"
      namespace: "nifi"
    secretKeys:
      username: "username"
      password: "password"
  nifiProperties:
    overrideConfigs: |
      nifi.sensitive.props.key=nifikop-poc-sensitive-key-2026
      nifi.web.proxy.context.path=/nifi-cluster
    webProxyHosts:
      - "localhost:8443"
      - "127.0.0.1:8443"
      - "localhost:30443"
      - "127.0.0.1:30443"
    webProxyNodePorts:
      enabled: true
      hosts:
        - "34.226.226.116"
  # Storage toggle:
  #   true  = direct NFS mounts via externalVolumeConfigs (no PV/PVC)
  #   false = dynamic PVCs via storageConfigs (requires a StorageClass)
  useExternalVolumes: false

  nodeConfigGroups:
    node_0_group:
      isNode: true
      imagePullPolicy: IfNotPresent
      serviceAccountName: "nifi-cluster"
      resourcesRequirements:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      # Used when useExternalVolumes: true
      externalVolumeConfigs:
        - name: data
          mountPath: "/opt/nifi/data"
          nfs:
            server: "10.88.232.89"
            path: "/data/nfs/node-0/data"
        - name: logs
          mountPath: "/opt/nifi/nifi-current/logs"
          nfs:
            server: "10.88.232.89"
            path: "/data/nfs/node-0/logs"
        - name: flowfile-repo
          mountPath: "/opt/nifi/flowfile_repository"
          nfs:
            server: "10.88.232.89"
            path: "/data/nfs/node-0/flowfile-repo"
        - name: content-repo
          mountPath: "/opt/nifi/content_repository"
          nfs:
            server: "10.88.232.89"
            path: "/data/nfs/node-0/content-repo"
        - name: provenance-repo
          mountPath: "/opt/nifi/provenance_repository"
          nfs:
            server: "10.88.232.89"
            path: "/data/nfs/node-0/provenance-repo"
        - name: config
          mountPath: "/opt/nifi/nifi-current/conf"
          nfs:
            server: "10.88.232.89"
            path: "/data/nfs/node-0/config"

      # Used when useExternalVolumes: false
      storageConfigs:
        - name: data
          mountPath: "/opt/nifi/data"
          pvcSpec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ebs-sc"
            resources:
              requests:
                storage: 10Gi
        - name: logs
          mountPath: "/opt/nifi/nifi-current/logs"
          pvcSpec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ebs-sc"
            resources:
              requests:
                storage: 10Gi
        - name: flowfile-repo
          mountPath: "/opt/nifi/flowfile_repository"
          pvcSpec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ebs-sc"
            resources:
              requests:
                storage: 10Gi
        - name: content-repo
          mountPath: "/opt/nifi/content_repository"
          pvcSpec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ebs-sc"
            resources:
              requests:
                storage: 10Gi
        - name: provenance-repo
          mountPath: "/opt/nifi/provenance_repository"
          pvcSpec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ebs-sc"
            resources:
              requests:
                storage: 10Gi
        - name: config
          mountPath: "/opt/nifi/nifi-current/conf"
          pvcSpec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ebs-sc"
            resources:
              requests:
                storage: 10Gi
  retryDurationMinutes: 15
  nodes:
    - id: 0
      nodeConfigGroup: "node_0_group"
  listenersConfig:
    internalListeners:
      - type: "https"
        name: "https"
        containerPort: 8443
      - type: "cluster"
        name: "cluster"
        containerPort: 6007
      - type: "s2s"
        name: "s2s"
        containerPort: 10000
      - type: "load-balance"
        name: "load-balance"
        containerPort: 6342
    sslSecrets:
      tlsSecretName: "nifi-cluster-tls"
      create: true
      clusterScoped: false
  externalServices:
    - name: "nifi-cluster-ip"
      spec:
        type: ClusterIP
        portConfigs:
          - port: 8443
            internalListenerName: "https"
      metadata:
        labels: {}
        annotations: {}
    - name: "nifi-cluster-np"
      spec:
        type: NodePort
        portConfigs:
          - port: 8443
            internalListenerName: "https"
            nodePort: 30443
      metadata:
        labels: {}
        annotations: {}

# Single-user login credentials (rendered into K8s Secret by the chart)
singleUserCredentials:
  username: admin
  password: "NiFi-P0C-2026!"

zookeeper:
  enabled: false
